site_name: django-file-form
site_url: https://mbraak.github.io/django-file-form/
repo_url: https://github.com/mbraak/django-file-form
repo_name: mbraak/django-file-form

theme:
  name: materialx
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.footer

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
    - Home: index.md
    - Usage: usage.md
    - Details: details.md
    - Upgrade: upgrade.md
    - Python settings: python_settings.md
    - Javascript options: javascript_options.md
    - Auto initialize javascript: auto_initialize.md
    - Form sets: form_sets.md
    - Model forms: model_forms.md
    - Admin: admin.md
    - Translations: translations.md
    - Customization: customization.md
    - Javascript events: javascript_events.md
    - Internals: internals.md
    - Changelog: changelog.md
