StylesPath = .github/styles
MinAlertLevel = suggestion
Vocab = Base
Packages = Google, proselint

[*.md]
BasedOnStyles = Vale, Google, proselint

# "admin" refers to the Django admin, not an administrator
Google.WordListCase = NO
Google.Parens = NO
# Style preferences that don't suit this project
Google.Passive = NO
Google.Contractions = NO
Google.Will = NO
Google.Semicolons = NO
# Doesn't recognise names like JavaScript and AWS S3 in headings
Google.Headings = NO
# AWS, AJAX, CORS and WSGI are familiar to the audience
Google.Acronyms = NO

# The changelog contains dates and contributor credits; only check spelling
[docs/changelog.md]
BasedOnStyles = Vale
