{% extends 'example_form.html' %}
{% load static %}

{% block title %}Wizard example{% endblock %}

{% block body %}
    <div class="wizard-step">Page {{ wizard.steps.step1 }} of {{ wizard.steps.count }}</div>
    <form
        method="POST"
        enctype="multipart/form-data"
        id="wizard-form"
    >
        {% csrf_token %}
        {{ wizard.management_form }}
        {{ wizard.form.as_p }}
        <div class="form-actions">
            {% if wizard.steps.prev %}
                <button name="wizard_goto_step" type="submit" value="{{ wizard.steps.prev }}" class="secondary">Previous</button>
            {% endif %}
            <input type="submit" value="Submit" />
        </div>
    </form>

    <script src="{% static file_form_js|safe %}"></script>
    <script src="{% static "wizard_form.js" %}"></script>
{% endblock %}
