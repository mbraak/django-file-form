[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-file-form"
version = "5.1.0"
description = "Django-file-form helps you to write forms with a pretty ajax upload"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.rst"]
authors = [{ name = "Marco Braak", email = "marco.braak@planet.nl" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/mbraak/django-file-form"
Documentation = "https://mbraak.github.io/django-file-form/"
Changelog = "https://mbraak.github.io/django-file-form/changelog/"

[dependency-groups]
# Django version used for local development; CI overrides it per matrix entry
django = ["Django>=6.1,<6.2"]
# Packages used by the example project in testproject/
testproject = [
    "boto3==1.43.121",
    "django-csp==4.0",
    "django-formtools==2.7",
    "django-storages==1.14.6",
    "pytz==2026.5",
]
test = [
    "cryptography==50.0.2",
    "Flask==3.1.3",
    "Flask-Cors==6.0.5",
    "moto==5.2.4",
    "psycopg==3.3.6",
    "selenium==4.51.0",
    "Werkzeug==3.1.9",
]
ci = [
    "coverage==7.16.2",
    "ruff==0.17.1",
]
docs = [
    "mkdocs-materialx==10.2.2",
    "properdocs==1.6.7",
]
# Installed by default with `uv sync`
dev = [
    { include-group = "django" },
    { include-group = "testproject" },
    { include-group = "test" },
    { include-group = "ci" },
]

[tool.uv]
# Ignore package releases newer than 3 days when resolving. This is set here
# instead of only in a user's uv.toml, so that uv.lock is the same everywhere.
exclude-newer = "3 days"

[tool.uv.dependency-groups]
# Django 6.1 needs Python 3.12+; the package itself still supports 3.10+
django = { requires-python = ">=3.12" }
dev = { requires-python = ">=3.12" }

[tool.setuptools.packages.find]
include = ["django_file_form*"]

[tool.coverage.run]
branch = true
source = ["django_file_form", "testproject/django_file_form_example"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long; the formatter handles line length
]

[tool.ruff.lint.per-file-ignores]
"testproject/testproject/settings.py" = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["django_file_form", "django_file_form_example", "testproject"]
