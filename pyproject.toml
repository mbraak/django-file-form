[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-file-form"
version = "5.0.1"
description = "Django-file-form helps you to write forms with a pretty ajax upload"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.rst"]
authors = [{ name = "Marco Braak", email = "marco.braak@planet.nl" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.urls]
Homepage = "https://github.com/mbraak/django-file-form"
Documentation = "https://mbraak.github.io/django-file-form/"
Changelog = "https://mbraak.github.io/django-file-form/changelog/"

[tool.setuptools.packages.find]
include = ["django_file_form*"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long; the formatter handles line length
]

[tool.ruff.lint.per-file-ignores]
"testproject/testproject/settings.py" = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["django_file_form", "django_file_form_example", "testproject"]
