[tox]
envlist = py313-django52,py314-django60,py314-django61

[testenv]
changedir = {toxinidir}/testproject
setenv =
    PYTHONWARNINGS = default
deps =
    -r{toxinidir}/testproject/requirements.txt
    -r{toxinidir}/testproject/requirements_test.txt
    django52: Django>=5.2,<5.3
    django6: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    python -Wd manage.py test django_file_form_example
basepython =
    py313: python3.13
    py314: python3.14