name: Publish docs via GitHub Pages

on:
  push:
    branches:
      - master
      - mkdocs-workflow

jobs:
  build:
    name: Deploy docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.12"

      - name: Run properdocs
        run: uv run --locked --only-group docs properdocs gh-deploy --force
