name: Continuous integration

on: [push]

permissions: {}

jobs:
  runner-job:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        django: ["django==5.2.19", "django==6.0.10", "django==6.1.3"]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: postgres
      POSTGRES_PORT: 5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          files: |
            frontend/src/**/*.ts
            django_file_form/**/*.py
            testproject/**/*.py
          incremental_files_only: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"
      - name: Install javascript packages
        working-directory: ./frontend
        run: npm clean-install --audit=false --fund=false --loglevel=http
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          # Separate cache per Django version, because it's installed outside uv.lock
          cache-suffix: ${{ matrix.django }}
      - name: Install python packages
        run: |
          uv sync --locked
          uv pip install "${{ matrix.django }}"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Run django check
        run: python testproject/manage.py check
      - name: Check migrations
        run: python testproject/manage.py makemigrations django_file_form --check --noinput --verbosity=1
        env:
          CHECK_MIGRATIONS: true
      - name: Build javascript
        working-directory: ./frontend
        run: npm run build
      - name: Javascript test
        working-directory: ./frontend
        run: npm run test
      - name: Create javascript coverage directory
        run: mkdir js_coverage
      - name: Collect static files
        run: python manage.py collectstatic --no-input
        working-directory: testproject
      - name: Test with coverage
        # Coverage settings are in pyproject.toml
        run: COVERAGE=true coverage run testproject/manage.py test django_file_form_example -v 2
      - name: Merge Python coverage
        run: coverage report && coverage lcov
      - name: Merge javascript coverage
        working-directory: ./coverage
        run: npm clean-install --audit=false --fund=false --loglevel=http && npm run merge_coverage
      - name: Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
