name: Compressed Size
on: [pull_request]

jobs:
  size-job:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check compressed size
        uses: mbraak/compressed-size-action@master
        with:
          install-script: npm install
          build-script: build
          cwd: ./frontend
          pattern: "../django_file_form/static/file_form/file_form.min.js"
          compression: "none"
